<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Dash</title>
<style>
:root{--bg:#1b1f3b;--ink:#fff7e0;--accent:#ffb703;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;touch-action:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{width:100%;max-width:960px;max-height:70vh;background:#6ec6ff;image-rendering:pixelated;border:4px solid var(--ink);border-radius:6px}
.pad{display:flex;justify-content:space-between;width:100%;max-width:960px;padding:12px 8px;box-sizing:border-box}
.pad div{display:flex;gap:10px}
.pad button{width:72px;height:72px;font-size:28px;border-radius:50%;border:3px solid var(--ink);background:#ffffff22;color:var(--ink);-webkit-user-select:none;user-select:none}
.pad button:active{background:var(--accent);color:#000}
.hint{font-size:13px;opacity:.7;margin:4px}
@media (hover:hover){.pad{display:none}}
</style>
</head>
<body>
<canvas id="c" width="480" height="270"></canvas>
<div class="hint">Arrows / WASD to move, Space to jump. Stomp enemies, grab coins, reach the flag.</div>
<div class="pad">
<div><button id="bl">◀</button><button id="br">▶</button></div>
<div><button id="bj">▲</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=480,H=270,T=16;
// Level: # ground, B brick, ? coin block, o coin, e enemy, F flag, P pipe
const L=[
"                                                                                                    ",
"                                                                                                    ",
"                                                                                                    ",
"                                                                                                    ",
"                                                                                                    ",
"                    ooo                          ooo                         ooo                    ",
"                                          B?B?B                                                     ",
"        ?B?                                              ooo        B?B           ooo          F    ",
"                          e        P       e                  e                e                    ",
"                  P      ###      ###     ###      ##      ###      ##     P   ####     ##        ##",
"##############  #########  ###########  ######  ######  ########  #####  #######  ##########  #####",
"##############  #########  ###########  ######  ######  ########  #####  #######  ##########  #####"];
const rows=L.length,cols=L[0].length;
let tiles,coins,enemies,flag,player,cam,score,state,keys={},t=0;
const solid=ch=>ch==='#'||ch==='B'||ch==='?'||ch==='P';
function reset(){
 tiles=L.map(r=>r.split(''));coins=[];enemies=[];flag=null;score=0;state='play';cam=0;
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ch=tiles[y][x];
  if(ch==='o'){coins.push({x:x*T+8,y:y*T+8,got:0});tiles[y][x]=' '}
  if(ch==='e'){enemies.push({x:x*T,y:y*T+4,w:14,h:12,vx:-.5,dead:0});tiles[y][x]=' '}
  if(ch==='F'){flag={x:x*T,y:(y-5)*T};tiles[y][x]=' '}}
 player={x:24,y:100,w:12,h:16,vx:0,vy:0,ground:false,face:1};
}
function tileAt(px,py){const x=Math.floor(px/T),y=Math.floor(py/T);if(x<0||x>=cols)return'#';if(y<0||y>=rows)return' ';return tiles[y][x]}
function hits(o){for(let y=Math.floor(o.y/T);y<=Math.floor((o.y+o.h-.01)/T);y++)for(let x=Math.floor(o.x/T);x<=Math.floor((o.x+o.w-.01)/T);x++){if(x<0||x>=cols||(y>=0&&y<rows&&solid(tiles[y][x])))return{x,y}}return null}
function move(o){
 o.x+=o.vx;let h=hits(o);if(h){o.x-=o.vx;o.vx*=o.bounce?-1:0;if(o.bounce)o.x+=o.vx}
 o.y+=o.vy;h=hits(o);o.ground=false;
 if(h){o.y-=o.vy;if(o.vy>0)o.ground=true;else if(o===player&&tiles[h.y]&&tiles[h.y][h.x]==='?'){tiles[h.y][h.x]='B';score+=100}
  o.vy=0}
}
function update(){
 t++;
 if(state!=='play'){if(keys.Enter||keys[' '])reset();return}
 const p=player,l=keys.ArrowLeft||keys.a,r=keys.ArrowRight||keys.d,j=keys.ArrowUp||keys.w||keys[' '];
 p.vx+=((r?1:0)-(l?1:0))*.3;if(!l&&!r)p.vx*=.8;p.vx=Math.max(-2.2,Math.min(2.2,p.vx));
 if(p.vx)p.face=p.vx>0?1:-1;
 if(j&&p.ground){p.vy=-5.6;p.ground=false}
 if(!j&&p.vy<-2)p.vy=-2;
 p.vy=Math.min(p.vy+.28,6);move(p);
 if(p.x<0)p.x=0;
 if(p.y>H+40)state='dead';
 for(const c of coins)if(!c.got&&Math.abs(c.x-(p.x+6))<10&&Math.abs(c.y-(p.y+8))<12){c.got=1;score+=50}
 for(const e of enemies){if(e.dead)continue;e.bounce=1;e.vy=(e.vy||0)+.28;
  const ox=e.x;move(e);
  // turn at ledges
  if(e.ground&&!solid(tileAt(e.x+(e.vx>0?e.w+1:-1),e.y+e.h+2))){e.vx*=-1;e.x=ox}
  if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
   if(p.vy>0&&p.y+p.h-e.y<10){e.dead=1;p.vy=-4;score+=200}else state='dead'}}
 if(flag&&p.x>flag.x-6)state='win';
 cam=Math.max(0,Math.min(cols*T-W,p.x-W/2+20));
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x-cam),Math.round(y),w,h)}
function draw(){
 ctx.clearRect(0,0,W,H);
 // clouds & hills
 ctx.fillStyle='#ffffffcc';for(let i=0;i<8;i++){const x=((i*170-cam*.3)%(W+120)+W+120)%(W+120)-60;ctx.fillRect(x,30+(i%3)*25,50,12);ctx.fillRect(x+10,22+(i%3)*25,30,10)}
 ctx.fillStyle='#4caf6a';for(let i=0;i<6;i++){const x=((i*210-cam*.5)%(W+200)+W+200)%(W+200)-100;ctx.beginPath();ctx.ellipse(x,200,90,60,0,Math.PI,0);ctx.fill()}
 const x0=Math.floor(cam/T),x1=x0+W/T+2;
 for(let y=0;y<rows;y++)for(let x=x0;x<x1&&x<cols;x++){const ch=tiles[y][x];
  if(ch==='#'){rect(x*T,y*T,T,T,'#8b5a2b');rect(x*T,y*T,T,4,'#3fa34d');rect(x*T+3,y*T+9,4,3,'#6d4220')}
  else if(ch==='B'){rect(x*T,y*T,T,T,'#c0612b');rect(x*T,y*T+7,T,2,'#7a3a15');rect(x*T+7,y*T,2,T,'#7a3a15')}
  else if(ch==='?'){rect(x*T,y*T,T,T,'#ffb703');rect(x*T+5,y*T+3,6,3,'#7a4a00');rect(x*T+8,y*T+6,3,3,'#7a4a00');rect(x*T+6,y*T+11,3,3,'#7a4a00')}
  else if(ch==='P'){rect(x*T,y*T,T,T,'#2e9e4f');rect(x*T,y*T,3,T,'#6fdc8c')}}
 for(const c of coins)if(!c.got){const w=Math.abs(Math.sin(t/12+c.x))*6+2;rect(c.x-w/2,c.y-6,w,12,'#ffd23f')}
 if(flag){rect(flag.x+6,flag.y,3,5*T,'#eee');rect(flag.x+9,flag.y+2,18,12,'#e63946')}
 for(const e of enemies){if(e.dead)continue;rect(e.x,e.y,e.w,e.h,'#7b3f1d');rect(e.x+2,e.y+3,3,3,'#fff');rect(e.x+9,e.y+3,3,3,'#fff');rect(e.x+1,e.y+e.h-3,5,3,'#222');rect(e.x+8,e.y+e.h-3,5,3,'#222')}
 const p=player;
 rect(p.x,p.y,p.w,p.h-5,'#e63946');rect(p.x+1,p.y,p.w-2,4,'#c1121f');rect(p.x+(p.face>0?7:1),p.y+5,4,4,'#fff');
 rect(p.x+1,p.y+p.h-6,p.w-2,6,'#1d4ed8');rect(p.x+(((t>>3)&1)&&p.ground&&Math.abs(p.vx)>.5?3:0),p.y+p.h-2,5,2,'#3b2a1a');
 ctx.fillStyle='#fff7e0';ctx.font='bold 14px Trebuchet MS,sans-serif';ctx.fillText('Score '+score,10,20);
 if(state!=='play'){ctx.fillStyle='#000a';ctx.fillRect(0,100,W,70);ctx.fillStyle='#fff7e0';ctx.font='bold 26px Trebuchet MS,sans-serif';ctx.textAlign='center';
  ctx.fillText(state==='win'?'You made it! Score '+score:'Oops, you fell!',W/2,138);ctx.font='13px Trebuchet MS,sans-serif';ctx.fillText('Press Space or tap jump to play again',W/2,158);ctx.textAlign='left'}
}
addEventListener('keydown',e=>{keys[e.key]=1;if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=0);
[['bl','ArrowLeft'],['br','ArrowRight'],['bj',' ']].forEach(([id,k])=>{const b=document.getElementById(id);
 ['pointerdown'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=1}));
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
reset();
let last=0,acc=0;
function loop(ts){acc+=Math.min(ts-last,100);last=ts;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
